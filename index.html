<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ball Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=68" />
</head>
<body>
  <main>
    <h1 id="gameTitle">Ball Battle</h1>

    <!-- หน้าเมนูหลัก -->
    <section id="menu" class="menu">
      <div class="menu-title">Ball Battle</div>
      <div class="menu-btns">
        <button id="menuPlay" class="menu-btn">เริ่มเกม</button>
        <button id="menuSettings" class="menu-btn secondary">ตั้งค่า</button>
      </div>
    </section>

    <!-- หน้าเตรียมสู้: เลือกโหมดและตัวละคร -->
    <section id="setup">
      <!-- แถบบน: กลับ / ชื่อหน้า / ปุ่มหลัก -->
      <div class="setup-top">
        <button id="backMenu" class="secondary">← เมนู</button>
        <div class="setup-title">เตรียมสู้</div>
        <div class="setup-actions">
          <button id="randomAll" class="secondary">สุ่มทั้งหมด</button>
          <button id="setupSettings" class="secondary">ตั้งค่า</button>
          <button id="fight" class="go-btn">เริ่มสู้</button>
        </div>
      </div>

      <!-- 3 ช่องเห็นครบในหน้าเดียว: ซ้าย = โหมด+ผู้เล่น | กลาง = ห้องทดลองสกิล | ขวา = รายละเอียดตัวละคร -->
      <!-- จอแคบ (มือถือ): สลับดูทีละช่องผ่านแท็บ เพื่อให้แต่ละช่องพอดีจอเดียวไม่ต้องเลื่อน -->
      <nav id="setupTabs" class="setup-tabs" aria-label="ส่วนของหน้าเตรียมสู้">
        <button type="button" data-tab="left" class="on">โหมด / ผู้เล่น</button>
        <button type="button" data-tab="center">ห้องทดลอง</button>
        <button type="button" data-tab="right">ตัวละคร</button>
      </nav>
      <div id="info" class="setup-grid" data-tab="left">
        <aside class="panel p-left">
          <div class="panel-t">โหมด</div>
          <button id="modeBtn" type="button" class="mode-btn" title="กดเพื่อเลือกโหมด"></button>
          <!-- select ซ่อนไว้เก็บค่าโหมด/จำนวนผู้เล่น (โค้ดอื่นอ่านจากตรงนี้) เลือกผ่านการ์ดโหมดแทน -->
          <select id="mode" hidden>
            <option value="1v1">1 ต่อ 1</option>
            <option value="2v2">2 ต่อ 2</option>
            <option value="ffa">ทุกคนสู้กันเอง (FFA)</option>
            <option value="waves">เอาชีวิตรอดเป็นคลื่น</option>
          </select>
          <select id="ffaCount" hidden>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
          <div class="panel-t">ผู้เล่น</div>
          <!-- ช่องเลือกตัวละครของผู้เล่นแต่ละคน: main.js สร้างให้ตามโหมด -->
          <div class="teams" id="players"></div>
        </aside>

        <div id="labBox" class="lab panel p-center">
          <div id="labTitle" class="lab-title">ห้องทดลองสกิล</div>
          <div id="labWrap" class="lab-wrap"></div>
          <div class="lab-btns">
            <button id="labReplay" class="secondary">เล่นซ้ำ</button>
            <button id="labAll" class="secondary">ใช้ทุกสกิลสลับกัน</button>
          </div>
          <div class="lab-hint">กดที่สกิลในการ์ดตัวละครเพื่อดูการจำลองสกิลนั้น (สู้กับหุ่นฝึก)</div>
        </div>

        <aside class="panel p-right">
          <div class="panel-t">ตัวละคร</div>
          <div id="cardTabs" class="card-tabs"></div>
          <div id="cards" class="cards"></div>
        </aside>
      </div>
    </section>

    <!-- แถบปุ่มตอนอยู่ในเกม -->
    <div class="controls" id="gamebar">
      <button id="gbAgain">สู้อีกครั้ง</button>
      <button id="gbSetup" class="secondary">↩ เลือกตัวละคร</button>
      <button id="gbMenu" class="secondary">เมนู</button>
      <button id="gbSettings" class="secondary">ตั้งค่า</button>
    </div>

    <div id="stage">
      <!-- แผงผู้เล่นอยู่รอบสนาม (main.js สร้างให้ตามโหมด): ซ้าย/ขวาบนจอกว้าง, เหนือสนามบนมือถือ -->
      <section id="hudL" class="hud"></section>
      <canvas id="arena" width="720" height="720"></canvas>
      <section id="hudR" class="hud"></section>
    </div>

    <p id="ver" class="ver">เวอร์ชัน 40</p>
  </main>

  <!-- ?v=35 กันเบราว์เซอร์/GitHub Pages ใช้ไฟล์เก่าจากแคช: เวลาแก้โค้ด ให้เปลี่ยนเลขนี้ทุกที่พร้อมกัน -->
  <script src="js/characters.js?v=68"></script>
  <script src="js/battle.js?v=43"></script>
  <script src="js/waves.js?v=1"></script>
  <script src="js/wave-music.js?v=1"></script>
  <script src="js/audio.js?v=46"></script>
  <script src="js/sound-config.js?v=39"></script>
  <script src="js/main.js?v=75"></script>
</body>
</html>
